name: Public snapshot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify public inventory and file hashes
        run: python scripts/check_public_release.py
      - name: Install open CJK fonts for synthetic rendering tests
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Reader tests with synthetic images
        run: python -m unittest discover -s tests -p test_reader.py -v
      - name: Processing tests with fake models
        run: python -m unittest discover -s tests -p test_reader_processing.py -v
      - name: Library tests with synthetic records
        run: python -m unittest discover -s tests -p test_library.py -v
      - name: Memory tests with synthetic records
        run: python -m unittest discover -s tests -p test_work_memory.py -v
      - name: Browser capture and overlay tests
        run: node --test tests/extension.test.mjs tests/content-overlay.test.mjs

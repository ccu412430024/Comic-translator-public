name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        run: python3 scripts/security_scan.py install
      - name: Verify scanner behavior with synthetic credentials
        run: python3 -m unittest discover -s tests -p test_secret_scanning.py -v
      - name: Scan every reachable commit and tag
        run: python3 scripts/security_scan.py history
      - name: Scan the checked-out files
        run: python3 scripts/security_scan.py worktree
